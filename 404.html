<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // GitHub Pages serves this for unknown paths. Send visitors back to the app root.
    var base = location.pathname.split('/').slice(0, 2).join('/') + '/';
    if (location.hostname.endsWith('github.io') === false) base = '/';
    location.replace(base + '#/');
  </script>
</head>
<body style="background:#e8e7e4;color:#1e1e21;font-family:sans-serif;padding:2rem">
  <a href="./" style="color:#9b5a2f">Go to Schols Revision</a>
</body>
</html>

<!doctype html>
<html lang="en-IE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Schols Revision · TCD Foundation Scholarship</title>
  <meta name="description" content="TCD Foundation Scholarship revision: past Schols papers for Business and Economics with dense, essay-ready plans.">
  <meta name="theme-color" content="#e8e7e4">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <script>
    (function () {
      try {
        var t = JSON.parse(localStorage.getItem('schols-theme'));
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) { document.documentElement.dataset.theme = 'light'; }
    })();
  </script>
  <link rel="preload" href="assets/fonts/figtree-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div class="shell" id="shell" data-collapsed="false" data-drawer="false">
    <aside class="side" aria-label="Subjects">
      <div class="side__head">
        <a class="brand" href="#/">
          <span class="brand__mark">S</span>
          <span class="brand__text"><span class="brand__title">Schols Revision</span><span class="brand__sub">TCD Foundation Scholarship</span></span>
        </a>
        <button class="side__collapse" id="collapse" type="button" aria-label="Collapse sidebar" title="Collapse sidebar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M9 4v16"/><path d="m15 10-2 2 2 2"/></svg>
        </button>
      </div>
      <nav class="side__nav" id="side-nav"></nav>
      <div class="side__foot"><span class="side__foot-text">Plans follow one shape: introduction, three main points, conclusion.</span></div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="top">
        <div class="top__row">
          <button class="menu-btn" id="menu" type="button" aria-label="Open menu">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <div class="crumb" id="crumb"></div>
          <nav class="tabs tabs--papers" id="paper-tabs" aria-label="Papers"></nav>
          <div class="top__tools">
            <div class="searchbox">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="search" type="search" placeholder="Search questions, facts, stats…" autocomplete="off" aria-label="Search">
              <div class="results" id="results" hidden></div>
            </div>
            <button class="icon-btn search-trigger" id="search-open" type="button" aria-label="Search">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </button>
            <button class="icon-btn" id="theme" type="button" aria-label="Switch theme"></button>
          </div>
        </div>
        <nav class="subtabs" id="subtabs" aria-label="Papers in this section"></nav>
      </header>
      <main class="page" id="page"></main>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
